# AutoLoop configuration — generated by autoloop init.
# Values here override dataclass defaults; env vars override these.

repo = "iamjameswalters/automatic-reader-view"

# Models
triage_model = "sonnet"
impl_model = "claude-opus-5[1m]"

# Timeouts (seconds)
impl_timeout = 900
triage_timeout = 600
test_timeout = 120

# GitHub
pr_reviewer = "iamjameswalters"

# Verification
verify_cmd = "echo 'no tests in this repo, feel free to proceed'"

# Decomposition threshold — issues above this trigger sub-issue creation
max_story_points = 3

# Retry / truncation limits
max_retries = 3
tree_truncation = 3000
diff_truncation = 8000
error_truncation = 2000
spec_truncation = 4000

# Paths the builder must never modify — issues targeting these get needs-human
protected_paths = ["autoloop.toml", ".claude/settings.json"]

# Scheduling: autoloop uses systemd user timers for scheduled runs.
# The timer_prefix controls which timers `autoloop status` looks for.
# E.g. if your timers are named patina-triage.timer / patina-implement.timer,
# set timer_prefix = "patina".
# timer_prefix = "autoloop"

# Labels that indicate an issue has already been triaged.
triage_labels = [
    "ready",
    "rejected",
    "needs-decomposition",
    "in-progress",
    "in-review",
    "needs-human",
]

# Jev evaluation — lightweight quality gate for triage and merge decisions.
# Set mode = "shadow" to log Jev scores without gating, or "gate" to block on them.
# Override at runtime with the JEV_MODE env var: JEV_MODE=shadow autoloop triage
[jev]
mode = "off"
